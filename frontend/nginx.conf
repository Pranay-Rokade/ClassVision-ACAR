# ============================================================
# Nginx config for ClassVision-ACAR frontend
# Serves React SPA + proxies API requests to Django backend
# ============================================================

server {
    listen 80;
    server_name localhost;

    # --- Serve React frontend ---
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all unknown routes → index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy API requests to Django backend container ---
    # These match the Django URL prefixes: /auth/, /classify/, /analysis/, /admin/

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video uploads can be large
        client_max_body_size 500M;

        # Video processing takes time
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /classify/ {
        proxy_pass http://backend:8000/classify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video uploads can be large
        client_max_body_size 500M;

        # Video processing takes time — 10 minute timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /analysis/ {
        proxy_pass http://backend:8000/analysis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Django media files (processed videos, CSVs)
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }
}
